<header>
 Welcome to Nellairajan Fruits Shop
</header>

<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <h2 *ngIf="showHeader()">Fruit Shop</h2>
    <img *ngIf="!showHeader()" class="image"
      src="https://www.thehealthy.com/wp-content/uploads/2025/05/GettyImages-2178111688.jpg" alt="Fruit Icon">

    <a *ngIf="showHeader()" (click)="goHome()" routerLinkActive="active">🏠 Home</a>

    <a *ngIf="showHeader()" (click)="goOrder()" routerLinkActive="active">🛒 Orders</a>

    <a *ngIf="showHeader() && showAdmin" (click)="goAdmin()" routerLinkActive="active">
      ⚙️ Admin
    </a>

    <a *ngIf="showHeader()" (click)="goContact()" routerLinkActive="active">📞 Contact</a>

    <a *ngIf="showHeader()" (click)="logout()">🚪 Logout</a>

  </div>
  <!-- MAIN CONTENT -->
  <div class="main">
    <router-outlet></router-outlet>
  </div>

</div>
<div>

</div>
